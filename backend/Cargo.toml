[package]
name = "ai-email-assistant"
version = "0.1.0"
edition = "2024"

[lib]
name = "ai_email_assistant"
path = "src/lib.rs"

[[bin]]
name = "ai-email-assistant"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7.5", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors"] }

# Database
sqlx = { version = "0.7.4", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
anyhow = "1"
async-trait = "0.1.80"
tracing = "0.1"
tracing-subscriber = "0.3"
pgvector = { version = "0.3.2", features = ["sqlx"] }

# API documentation (Swagger UI)
utoipa = { version = "4.2.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6.0.0", features = ["axum"] }
bcrypt = "0.15.1"
jsonwebtoken = "9.3.0"
axum-extra = { version = "0.9.3", features = ["typed-header"] }
aes-gcm = "0.10.3"
rand = "0.10.1"
base64 = "0.22.1"
oauth2 = "4.4.2"
validator = "0.20.0"
futures-util = "0.3.32"
tokio-stream = "0.1.18"
async-stream = "0.3"
pdf-extract = "0.7"
text-splitter = "0.16"
whatlang = "0.16"

# RAG Framework
rig-core = { version = "0.36", features = ["derive"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
mime = "0.3"
