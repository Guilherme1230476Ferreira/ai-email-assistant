server {
    listen 80;
    server_name _;  # Accepts any hostname / bare IP

    # ── SvelteKit Backoffice ───────────────────────────────────────────────────
    # All regular traffic goes to the SvelteKit Node server.
    # SvelteKit then calls the backend internally via Docker network.
    location / {
        proxy_pass          http://backoffice:3001;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        'upgrade';
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
    }

    # ── Rust/Axum Backend API ─────────────────────────────────────────────────
    # Browser-originated /api/ calls come here directly (Nginx routes them
    # to the backend container). SSR-originated calls also go through
    # hooks.server.ts → backend:3000 directly (bypasses Nginx).
    location /api/ {
        proxy_pass          http://backend:3000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
