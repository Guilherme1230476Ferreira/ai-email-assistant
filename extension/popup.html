<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>MailMate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000000;
      color: #ffffff;
    }

    .container {
      padding: 24px;
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: #22d3ee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 20px;
      height: 20px;
      color: #000;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #22d3ee;
    }

    /* ── Status ──────────────────────────────────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .status-connected {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    .status-disconnected {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-connected .status-dot { background: #10b981; }
    .status-disconnected .status-dot { background: #ef4444; }

    /* ── Form ────────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #67e8f9;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #1f1f23;
      border-radius: 8px;
      background: #0a0a0a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
    }

    input::placeholder { color: #71717a; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #22d3ee;
      color: #000000;
    }

    .btn-primary:hover {
      background: #06b6d4;
      box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .btn-ghost {
      background: transparent;
      color: #a5f3fc;
      border: 1px solid #1f1f23;
      margin-top: 8px;
    }

    .btn-ghost:hover {
      background: #111113;
      border-color: #2a2a30;
    }

    /* ── Error ───────────────────────────────────────────────────────── */
    .error {
      color: #fca5a5;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .error.show { display: block; }

    /* ── User Info ───────────────────────────────────────────────────── */
    .user-email {
      font-weight: 500;
      color: #22d3ee;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.912 5.813a2 2 0 0 0 1.272 1.278L21 12l-5.816 1.91a2 2 0 0 0-1.275 1.278L12 21l-1.91-5.812a2 2 0 0 0-1.277-1.278L3 12l5.813-1.91a2 2 0 0 0 1.278-1.277L12 3z"/>
        </svg>
      </div>
      <h1>MailMate</h1>
    </div>

    <!-- Connected State -->
    <div id="logged-in-view" class="hidden">
      <div class="status status-connected">
        <div class="status-dot"></div>
        <span>Connected as <span id="user-email" class="user-email"></span></span>
      </div>
      <p style="font-size: 13px; color: #a1a1aa; line-height: 1.5;">
        Open Gmail, click <strong style="color:#22d3ee;">Reply</strong> on any email, then click the
        <strong style="color:#22d3ee;">✨ Generate Reply</strong> button in the compose toolbar.
      </p>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </div>

    <!-- Login Form -->
    <div id="login-view">
      <div class="status status-disconnected">
        <div class="status-dot"></div>
        <span>Not connected</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="error"></div>
        <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
