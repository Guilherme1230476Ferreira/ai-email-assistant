<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>MailMate</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 200px;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    .container {
      padding: 24px;
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      width: 36px;
      height: 36px;
      background: #2dd4bf;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(45, 212, 191, 0.25);
    }

    .logo svg {
      width: 18px;
      height: 18px;
      color: #000;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.02em;
    }

    .header-text span {
      font-size: 11px;
      color: #71717a;
      font-weight: 500;
    }

    /* ── Status ──────────────────────────────────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-connected {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }

    .status-disconnected {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-connected .status-dot { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
    .status-disconnected .status-dot { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }

    /* ── Form ────────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: #fafafa;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2dd4bf;
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
    }

    input::placeholder { color: #52525b; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2dd4bf;
      color: #000000;
      letter-spacing: -0.01em;
    }

    .btn-primary:hover {
      background: #14b8a6;
      box-shadow: 0 4px 16px rgba(45, 212, 191, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .btn-ghost {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 10px;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fafafa;
    }

    /* ── Error ───────────────────────────────────────────────────────── */
    .error {
      color: #fca5a5;
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      display: none;
    }

    .error.show { display: block; }

    /* ── User Info ───────────────────────────────────────────────────── */
    .user-email {
      font-weight: 600;
      color: #2dd4bf;
    }

    .info-text {
      font-size: 13px;
      color: #71717a;
      line-height: 1.6;
      margin-top: 12px;
    }

    .info-text strong {
      color: #2dd4bf;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.912 5.813a2 2 0 0 0 1.272 1.278L21 12l-5.816 1.91a2 2 0 0 0-1.275 1.278L12 21l-1.91-5.812a2 2 0 0 0-1.277-1.278L3 12l5.813-1.91a2 2 0 0 0 1.278-1.277L12 3z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>MailMate</h1>
        <span>AI Email Assistant</span>
      </div>
    </div>

    <!-- Connected State -->
    <div id="logged-in-view" class="hidden">
      <div class="status status-connected">
        <div class="status-dot"></div>
        <span>Connected as <span id="user-email" class="user-email"></span></span>
      </div>
      <p class="info-text">
        Open Gmail, click <strong>Reply</strong> on any email, then click the
        <strong>✨ Generate Reply</strong> button in the compose toolbar.
      </p>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </div>

    <!-- Login Form -->
    <div id="login-view">
      <div class="status status-disconnected">
        <div class="status-dot"></div>
        <span>Not connected — sign in to get started</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="error"></div>
        <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
