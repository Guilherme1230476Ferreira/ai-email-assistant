# /etc/nginx/sites-available/ai-email-assistant
# Deploy with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-email-assistant
#   sudo ln -sf /etc/nginx/sites-available/ai-email-assistant /etc/nginx/sites-enabled/ai-email-assistant
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # replace with your actual domain/IP if needed

    # ── File upload size ──────────────────────────────────────────────────────
    # Allows PDFs and other documents up to 50 MB.
    # Default nginx limit is 1 MB — without this, large uploads return 413.
    client_max_body_size 50M;

    # ── Upload / proxy timeouts ───────────────────────────────────────────────
    # Knowledge-base uploads embed every chunk (150ms each × 100s of chunks).
    # A 200-page PDF can take ~60s to process server-side.
    # These timeouts keep the connection alive during that window.
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
    send_timeout            300s;

    # ── Backend API (Rust/Axum on :3000) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Disable buffering for SSE (streaming email generation)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── SvelteKit Backoffice (Node on :3001) ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
