name: Deploy

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - nginx/**
      - deploy/**
      - .github/workflows/deploy.yml
  schedule:
    # Daily refresh at 06:00 UTC (07:00 Lisbon)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent multiple deploys from running simultaneously
concurrency:
  group: deploy-vs224
  cancel-in-progress: false

# Ensure github.token can read the private repo (needed for git fetch)
permissions:
  contents: read

# ── Deploy Job ────────────────────────────────────────────────────────────────
# Runs on the self-hosted runner (vs224) as user 'ghrunner', then
# SSHes to root@localhost for privileged operations (systemctl, cp to /etc).
jobs:
  deploy:
    name: Deploy to vs224
    runs-on: self-hosted

    steps:
      # Step 1: Checkout code on the runner workspace
      # This ensures the runner always has the latest code, even for
      # scheduled and workflow_dispatch triggers.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy via SSH to root
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ── Prepare SSH key ──────────────────────────────────────────────
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@127.0.0.1"

          # ── Deploy script (runs as root) ─────────────────────────────────
          # Using unquoted 'EOF' would prevent variable expansion.
          # We use quoted 'DEPLOY_EOF' for the parts that should NOT expand,
          # but we need GITHUB_TOKEN to expand, so we use unquoted EOF.
          $SSH << EOF
            set -e

            # ── 0. Environment setup ─────────────────────────────────────
            # Ensure cargo and node are in PATH (installed under root)
            export PATH="/root/.cargo/bin:/usr/local/bin:/usr/bin:/bin:\$PATH"
            
            # Source nvm if it exists (for node/npm)
            [ -s "/root/.nvm/nvm.sh" ] && source "/root/.nvm/nvm.sh"
            
            REPO=/opt/ai-email-assistant
            ENV_FILE=\$REPO/.env

            # Verify .env exists on the server
            if [ ! -f "\$ENV_FILE" ]; then
              echo "❌ ERROR: \$ENV_FILE not found!"
              echo "   Create it manually on the server first."
              echo "   See deploy/setup.sh or the server setup guide."
              exit 1
            fi

            # ── PostgreSQL health check ───────────────────────────────────
            echo "==> [0/7] Checking database health..."
            source <(grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB|DATABASE_URL)' "\$ENV_FILE")
            export POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL

            if ! systemctl is-active --quiet postgresql; then
              echo "❌ PostgreSQL is NOT running. Starting it..."
              systemctl start postgresql
              sleep 3
            fi

            if PGPASSWORD="\$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "\$POSTGRES_USER" -d "\$POSTGRES_DB" -c "SELECT 1;" &>/dev/null; then
              echo "    ✅ Database '\${POSTGRES_DB}' is reachable"
            else
              echo "❌ Cannot connect to database. Check PostgreSQL setup:"
              echo "   sudo -u postgres psql -c \"CREATE USER admin WITH PASSWORD 'admin' SUPERUSER CREATEDB;\""
              echo "   sudo -u postgres psql -c \"CREATE DATABASE ai_email_assistant OWNER admin;\""
              echo "   Run migrations: ls \$REPO/backend/migrations/*.sql | sort | xargs -I{} psql -h 127.0.0.1 -U admin -d ai_email_assistant -f {}"
              exit 1
            fi

            # ── 1. Pull latest code ──────────────────────────────────────
            echo "==> [1/7] Pulling latest code..."
            cd \$REPO
            # Temporarily set remote URL with token for private repo auth
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Guilherme1230476Ferreira/ai-email-assistant.git
            git fetch --all --prune
            git reset --hard origin/main
            # Remove token from persisted remote URL
            git remote set-url origin https://github.com/Guilherme1230476Ferreira/ai-email-assistant.git

            # ── 2. Run database migrations ───────────────────────────────
            echo "==> [2/7] Running database migrations..."
            source <(grep '^DATABASE_URL=' "\$ENV_FILE")
            export DATABASE_URL
            cd \$REPO/backend

            # Use sqlx-cli if available, otherwise use psql fallback
            if command -v sqlx &>/dev/null; then
              sqlx migrate run
              echo "    Migrations applied via sqlx."
            else
              echo "    sqlx-cli not found — using psql fallback..."
              source <(grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB)' "\$ENV_FILE")
              for f in \$(ls -1 \$REPO/backend/migrations/*.sql | sort); do
                echo "    Applying \$(basename \$f)..."
                PGPASSWORD="\$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "\$POSTGRES_USER" -d "\$POSTGRES_DB" -f "\$f" 2>/dev/null || true
              done
              echo "    Migrations applied via psql."
            fi

            # ── 3. Build Rust backend ────────────────────────────────────
            echo "==> [3/7] Building Rust backend (release)..."
            cd \$REPO/backend
            export SQLX_OFFLINE=true
            cargo build --release 2>&1 | tail -5
            echo "    Backend compiled."

            # ── 4. Build SvelteKit backoffice ────────────────────────────
            echo "==> [4/7] Building SvelteKit backoffice..."
            cd \$REPO/backoffice
            npm ci --ignore-scripts 2>&1 | tail -3
            npm run build 2>&1 | tail -5
            echo "    Backoffice built."

            # ── 5. Configure Nginx ───────────────────────────────────────
            echo "==> [5/7] Configuring Nginx..."
            cp \$REPO/nginx/nginx.conf /etc/nginx/sites-available/ai-email-assistant
            # Always ensure the symlink exists
            ln -sf /etc/nginx/sites-available/ai-email-assistant \
                   /etc/nginx/sites-enabled/ai-email-assistant
            # Remove default site if it exists
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            echo "    Nginx configured."

            # ── 6. Update systemd services ───────────────────────────────
            echo "==> [6/7] Updating systemd services..."
            cp \$REPO/deploy/ai-backend.service /etc/systemd/system/
            cp \$REPO/deploy/ai-backoffice.service /etc/systemd/system/
            systemctl daemon-reload

            # ── 7. Restart services ──────────────────────────────────────
            echo "==> [7/7] Restarting services..."
            systemctl restart ai-backend
            sleep 3
            systemctl restart ai-backoffice

            # ── Health check ─────────────────────────────────────────────
            echo "==> Health check..."
            sleep 5

            if systemctl is-active --quiet ai-backend; then
              echo "    ✅ ai-backend is running"
            else
              echo "    ❌ ai-backend FAILED"
              journalctl -u ai-backend -n 30 --no-pager
              exit 1
            fi

            if systemctl is-active --quiet ai-backoffice; then
              echo "    ✅ ai-backoffice is running"
            else
              echo "    ❌ ai-backoffice FAILED"
              journalctl -u ai-backoffice -n 30 --no-pager
              exit 1
            fi

            # Quick HTTP health checks
            if command -v curl &>/dev/null; then
              HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
              echo "    Backend health: HTTP \$HTTP_CODE"
              HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
              echo "    Backoffice:     HTTP \$HTTP_CODE"
            fi

            echo ""
            echo "══════════════════════════════════════════════════════════"
            echo "  ✅ Deploy complete!"
            echo "  Backend:    http://localhost:3000"
            echo "  Backoffice: http://localhost:3001"
            echo "  Public:     http://vs224.dei.isep.ipp.pt:2224"
            echo "══════════════════════════════════════════════════════════"
          EOF

          # Clean up SSH key
          rm -f ~/.ssh/deploy_key
