name: Deploy

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - nginx/**
      - deploy/**
      - .github/workflows/deploy.yml
  schedule:
    # Daily refresh at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# ── Deploy Job ────────────────────────────────────────────────────────────────
# Runs on the self-hosted runner (vs224), then SSHes to root@localhost
# so all deploy commands run with full root privileges (required for systemctl).
jobs:
  deploy:
    name: Deploy to vs224
    runs-on: self-hosted

    steps:
      - name: SSH into root and deploy natively
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Save the SSH key securely
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Connect to localhost as root and execute the deployment commands.
          # Note: We use unquoted EOF so that $GITHUB_TOKEN is evaluated by the runner
          # and injected into the script before it is sent over SSH.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@127.0.0.1 << EOF
            set -e

            echo "==> Pulling latest code..."
            cd /opt/ai-email-assistant
            # Pull directly using the temporary action token so we don't save an expiring token to git config
            git pull https://x-access-token:${GITHUB_TOKEN}@github.com/Guilherme1230476Ferreira/ai-email-assistant.git main

            echo "==> Building Rust backend..."
            cd /opt/ai-email-assistant/backend
            export SQLX_OFFLINE=true
            cargo build --release

            echo "==> Building SvelteKit backoffice..."
            cd /opt/ai-email-assistant/backoffice
            npm ci
            npm run build

            echo "==> Reloading Nginx config..."
            cp /opt/ai-email-assistant/nginx/nginx.conf \
               /etc/nginx/sites-available/ai-email-assistant
            nginx -t && systemctl reload nginx

            echo "==> Restarting services..."
            systemctl restart ai-backend
            systemctl restart ai-backoffice

            echo "==> Health check..."
            sleep 5
            systemctl is-active --quiet ai-backend   || { journalctl -u ai-backend -n 20 --no-pager; exit 1; }
            systemctl is-active --quiet ai-backoffice || { journalctl -u ai-backoffice -n 20 --no-pager; exit 1; }
            echo "✅ All services running."
            systemctl status ai-backend ai-backoffice --no-pager
          EOF
