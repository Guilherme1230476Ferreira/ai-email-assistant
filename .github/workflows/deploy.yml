name: Deploy

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - nginx/**
      - docker-compose.yml
      - .github/workflows/deploy.yml
  schedule:
    # Daily refresh at 06:00 UTC
    - cron: '0 6 * * *'
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

# ── Deploy Job ────────────────────────────────────────────────────────────────
# Runs directly on the self-hosted runner (vs224.dei.isep.ipp.pt).
# No SSH needed — the runner IS the server.
jobs:
  deploy:
    name: Deploy Stack to vs224
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /opt/ai-email-assistant

    steps:
      - name: Pull latest code
        run: git pull origin main

      - name: Rebuild and restart containers
        run: docker compose up -d --build --remove-orphans

      - name: Remove dangling images
        run: docker image prune -f

      - name: Show running services
        run: docker compose ps
