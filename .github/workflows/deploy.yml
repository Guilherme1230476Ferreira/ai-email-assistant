name: Deploy

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - nginx/**
      - deploy/**
      - .github/workflows/deploy.yml
  schedule:
    # Daily refresh at 06:00 UTC (07:00 Lisbon)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent multiple deploys from running simultaneously
concurrency:
  group: deploy-vs224
  cancel-in-progress: false

permissions:
  contents: read

# ── Job 1: Build Rust binary on GitHub-hosted runner ─────────────────────────
# GitHub's ubuntu-latest has full internet → can reach static.crates.io.
# The university server cannot (firewall blocks it) → this solves the problem.
jobs:
  build-backend:
    name: Build Rust backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build release binary
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-email-assistant-binary
          path: backend/target/release/ai-email-assistant
          retention-days: 1

# ── Job 2: Deploy to vs224 ────────────────────────────────────────────────────
# Runs on the self-hosted runner (vs224). Downloads the pre-built binary
# from Job 1 instead of compiling on the server (which has no crates.io access).
  deploy:
    name: Deploy to vs224
    runs-on: self-hosted
    needs: build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: ai-email-assistant-binary
          path: ./artifact

      - name: Deploy via SSH to root
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ── Prepare SSH key ──────────────────────────────────────────────
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@127.0.0.1"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # ── Phase 1: DB bootstrap + code pull + migrations ────────────────
          $SSH << EOF
            set -e
            export PATH="/root/.cargo/bin:/usr/local/bin:/usr/bin:/bin:\$PATH"
            [ -s "/root/.nvm/nvm.sh" ] && source "/root/.nvm/nvm.sh"

            REPO=/opt/ai-email-assistant
            ENV_FILE=\$REPO/.env

            if [ ! -f "\$ENV_FILE" ]; then
              echo "❌ ERROR: \$ENV_FILE not found on server!"
              exit 1
            fi

            # ── PostgreSQL bootstrap ─────────────────────────────────────────
            echo "==> [0/6] Ensuring database is up and healthy..."
            bash \$REPO/deploy/db-bootstrap.sh
            echo "    ✅ Database ready."

            # ── 1. Pull latest code ──────────────────────────────────────────
            echo "==> [1/6] Pulling latest code..."
            cd \$REPO
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Guilherme1230476Ferreira/ai-email-assistant.git
            git fetch --all --prune
            git reset --hard origin/main
            git remote set-url origin https://github.com/Guilherme1230476Ferreira/ai-email-assistant.git

            # ── 2. Run database migrations ───────────────────────────────────
            echo "==> [2/6] Running database migrations..."
            source <(grep '^DATABASE_URL=' "\$ENV_FILE")
            export DATABASE_URL
            cd \$REPO/backend

            if command -v sqlx &>/dev/null; then
              sqlx migrate run
              echo "    Migrations applied via sqlx."
            else
              echo "    sqlx-cli not found — using psql fallback..."
              source <(grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB)' "\$ENV_FILE")
              for f in \$(ls -1 \$REPO/backend/migrations/*.sql | sort); do
                echo "    Applying \$(basename \$f)..."
                PGPASSWORD="\$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "\$POSTGRES_USER" -d "\$POSTGRES_DB" -f "\$f" 2>/dev/null || true
              done
              echo "    Migrations applied via psql."
            fi
          EOF

          # ── Phase 2: Copy pre-built binary (avoids server compiling) ─────
          echo "==> [3/6] Deploying pre-built binary..."
          chmod +x ./artifact/ai-email-assistant
          # Create destination dir if it doesn't exist yet
          $SSH "mkdir -p /opt/ai-email-assistant/backend/target/release"
          # SCP to a temp file — cannot overwrite a file the running service has open
          $SCP ./artifact/ai-email-assistant root@127.0.0.1:/opt/ai-email-assistant/backend/target/release/ai-email-assistant.new
          # Atomically replace the old binary and ensure it is executable
          $SSH "chmod +x /opt/ai-email-assistant/backend/target/release/ai-email-assistant.new \
            && mv /opt/ai-email-assistant/backend/target/release/ai-email-assistant.new \
                  /opt/ai-email-assistant/backend/target/release/ai-email-assistant"
          echo "    ✅ Binary deployed (compiled on GitHub-hosted runner)."

          # ── Phase 3: Build frontend + restart services ────────────────────
          $SSH << EOF
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:\$PATH"
            [ -s "/root/.nvm/nvm.sh" ] && source "/root/.nvm/nvm.sh"

            REPO=/opt/ai-email-assistant

            # ── 4. Build SvelteKit backoffice ────────────────────────────────
            echo "==> [4/6] Building SvelteKit backoffice..."
            cd \$REPO/backoffice
            npm ci --ignore-scripts 2>&1 | tail -3
            npm run build 2>&1 | tail -5
            echo "    Backoffice built."

            # ── 5. Configure Nginx ───────────────────────────────────────────
            echo "==> [5/6] Configuring Nginx..."
            cp \$REPO/nginx/nginx.conf /etc/nginx/sites-available/ai-email-assistant
            ln -sf /etc/nginx/sites-available/ai-email-assistant \
                   /etc/nginx/sites-enabled/ai-email-assistant
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            echo "    Nginx configured."

            # ── 6. Restart services ──────────────────────────────────────────
            echo "==> [6/6] Restarting services..."
            cp \$REPO/deploy/ai-backend.service /etc/systemd/system/
            cp \$REPO/deploy/ai-backoffice.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl restart ai-backend
            sleep 3
            systemctl restart ai-backoffice

            # ── Health check ─────────────────────────────────────────────────
            echo "==> Health check..."
            sleep 5

            if systemctl is-active --quiet ai-backend; then
              echo "    ✅ ai-backend is running"
            else
              echo "    ❌ ai-backend FAILED"
              journalctl -u ai-backend -n 30 --no-pager
              exit 1
            fi

            if systemctl is-active --quiet ai-backoffice; then
              echo "    ✅ ai-backoffice is running"
            else
              echo "    ❌ ai-backoffice FAILED"
              journalctl -u ai-backoffice -n 30 --no-pager
              exit 1
            fi

            HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            echo "    Backend health: HTTP \$HTTP_CODE"
            HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
            echo "    Backoffice:     HTTP \$HTTP_CODE"

            echo ""
            echo "══════════════════════════════════════════════════════════"
            echo "  ✅ Deploy complete!"
            echo "  Backend:    http://localhost:3000"
            echo "  Backoffice: http://localhost:3001"
            echo "  Public:     http://vs224.dei.isep.ipp.pt:2224"
            echo "══════════════════════════════════════════════════════════"
          EOF

          # Clean up SSH key
          rm -f ~/.ssh/deploy_key
