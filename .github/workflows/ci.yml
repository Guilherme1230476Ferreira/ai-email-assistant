name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/ci.yml

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    
    env:
      DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_TIMEOUT: 120
      SQLX_OFFLINE: false

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Environment
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          echo "POSTGRES_USER=$POSTGRES_USER" > .env
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
          echo "POSTGRES_DB=$POSTGRES_DB" >> .env
          echo "DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" >> $GITHUB_ENV
        working-directory: ./

      - name: Start services
        run: docker compose up -d
        working-directory: ./

      - name: Run cargo check
        run: cargo check --verbose
        working-directory: ./backend

      - name: Run tests
        run: cargo test

 #     - name: Clippy (lint)
#        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check