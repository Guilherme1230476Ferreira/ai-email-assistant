name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml

# Prevent multiple CI runs from clashing on the same runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust Backend ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Backend)
    runs-on: self-hosted

    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HTTP_TIMEOUT: 300
      CARGO_NET_RETRY: 5
      CARGO_HTTP_CHECK_REVOCABLE: false

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # cargo check — best-effort (ISEP network may block crates.io)
      - name: Cargo check (offline)
        continue-on-error: true
        env:
          SQLX_OFFLINE: true
        run: cargo check --verbose
        working-directory: ./backend

      # cargo test uses #[sqlx::test] which needs a live PostgreSQL connection.
      # The self-hosted runner is on vs224 alongside PostgreSQL.
      - name: Check database is reachable
        run: |
          ENV_FILE=/opt/ai-email-assistant/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ No .env file found at $ENV_FILE — skipping DB tests"
            echo "DB_AVAILABLE=false" >> $GITHUB_ENV
            exit 0
          fi
          DB_URL=$(grep '^DATABASE_URL=' "$ENV_FILE" | cut -d'=' -f2-)
          if psql "$DB_URL" -c "SELECT 1;" &>/dev/null; then
            echo "✅ Database is reachable"
            echo "DB_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "⚠ Database unreachable — DB tests will be skipped"
            echo "DB_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Run tests
        if: env.DB_AVAILABLE == 'true'
        continue-on-error: true
        env:
          SQLX_OFFLINE: false
        run: |
          export DATABASE_URL=$(grep '^DATABASE_URL=' /opt/ai-email-assistant/.env | cut -d'=' -f2-)
          cargo test

  # ── SvelteKit Backoffice ────────────────────────────────────────────────────
  backoffice-build:
    name: Build & Test (Backoffice)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backoffice

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: 'backoffice/package-lock.json'

      - name: Install dependencies
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the VM cannot reach cdn.playwright.dev
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run SvelteKit check
        run: npm run check

      - name: Build backoffice
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      # E2E tests are skipped in CI — the VM has no external network access
      # to download browsers, and E2E requires a running backend + DB.
      # Run E2E tests locally: npm run test:e2e