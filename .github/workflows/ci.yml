name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml

# Prevent multiple CI runs from clashing on the same runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HTTP_TIMEOUT: 120
      CARGO_HTTP_CHECK_REVOCABLE: false
      # SQLX_OFFLINE is set per-step: check uses offline cache, test needs live DB

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cargo check
        env:
          SQLX_OFFLINE: true
        run: cargo check --verbose
        working-directory: ./backend

      - name: Run tests
        # #[sqlx::test] creates/drops temporary databases per test.
        # The self-hosted runner is on vs224 — PostgreSQL is local.
        # We read DATABASE_URL directly from the server .env (no GitHub secret needed).
        # Requires 'admin' user to have CREATEDB privilege:
        #   sudo -u postgres psql -c "ALTER USER admin CREATEDB;"
        env:
          SQLX_OFFLINE: false
          DATABASE_URL: ${{ env.SERVER_DATABASE_URL }}
        run: |
          # Source DATABASE_URL from the server .env if it exists
          ENV_FILE=/opt/ai-email-assistant/.env
          if [ -f "$ENV_FILE" ]; then
            export DATABASE_URL=$(grep '^DATABASE_URL=' "$ENV_FILE" | cut -d'=' -f2-)
          elif [ -n "${{ secrets.DATABASE_URL }}" ]; then
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          else
            echo "⚠ No DATABASE_URL found — skipping integration tests"
            exit 0
          fi
          cargo test

     ## - name: Check formatting
       ## run: cargo fmt -- --check

  backoffice-build:
    name: Build Backoffice
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backoffice

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: 'backoffice/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit check
        run: npm run check

      - name: Build backoffice
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true