name: CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - backoffice/**
      - .github/workflows/ci.yml

# Prevent multiple CI runs from clashing on the same runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HTTP_TIMEOUT: 120
      CARGO_HTTP_CHECK_REVOCABLE: false
      # This tells SQLx to use the cached queries instead of a live DB
      SQLX_OFFLINE: true

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --verbose
        working-directory: ./backend

      - name: Run tests
        run: cargo test

     ## - name: Check formatting
       ## run: cargo fmt -- --check

  backoffice-build:
    name: Build Backoffice
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backoffice

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: 'backoffice/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit check
        run: npm run check

      - name: Build backoffice
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true